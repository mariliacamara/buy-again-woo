name: Release Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Verify plugin version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          HEADER_VERSION=$(grep -oP '^\s*\*\s*Version:\s*\K\S+' buy-again-woo.php)
          CONSTANT_VERSION=$(grep -oP "define\(\s*'BUY_AGAIN_WOO_VERSION',\s*'\K[^']+" buy-again-woo.php)

          echo "Tag: $TAG_VERSION | Header: $HEADER_VERSION | Constant: $CONSTANT_VERSION"

          if [ "$TAG_VERSION" != "$HEADER_VERSION" ] || [ "$TAG_VERSION" != "$CONSTANT_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match the plugin version in buy-again-woo.php"
            exit 1
          fi

          if ! grep -q "^## \[$TAG_VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $TAG_VERSION"
            exit 1
          fi

      - name: Extract release notes
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          cat release-notes.md

      - name: Install dependencies
        run: composer install

      - name: Run PHPCS
        run: composer lint

      - name: Run PHPStan
        run: composer analyse

      - name: Install production dependencies
        run: |
          rm -rf vendor
          composer install --no-dev --optimize-autoloader

      - name: Create plugin zip
        run: |
          mkdir -p release

          rsync -av . release/buy-again-woo \
            --exclude-from=.distignore

          cd release
          zip -r buy-again-woo.zip buy-again-woo

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/buy-again-woo.zip
          body_path: release-notes.md