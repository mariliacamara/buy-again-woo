name: CI

on:
  push:
    branches:
      - development
      - main

  pull_request:
    branches:
      - development
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: composer install

      - name: Run PHPCS
        run: composer lint

      - name: Run PHPStan
        run: composer analyse